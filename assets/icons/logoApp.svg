
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#353941"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE64A"/>
      <stop offset="1" stop-color="#FFB900"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7D9DF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#707783"/>
      <stop offset="1" stop-color="#292D35"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect x="12" y="12" width="488" height="488"
        rx="105" fill="url(#bg)"/>

  <!-- Sombra del calendario -->
  <rect x="77" y="104" width="358" height="345"
        rx="36" fill="#000" opacity=".4" filter="url(#shadow)"/>

  <!-- Calendario -->
  <rect x="78" y="100" width="356" height="345"
        rx="36" fill="url(#paper)"/>

  <!-- Cabecera amarilla -->
  <path d="M78 137 Q78 100 115 100 H397
           Q434 100 434 137 V184 H78Z"
        fill="url(#yellow)"/>

  <path d="M78 184 H434" stroke="#C68B00" stroke-width="5"/>

  <!-- Anillas -->
  <g fill="url(#ring)" stroke="#9097A2" stroke-width="3">
    <rect x="143" y="68" width="34" height="83" rx="17"/>
    <rect x="335" y="68" width="34" height="83" rx="17"/>
  </g>

  <!-- Días -->
  <g fill="#414650">
    <rect x="119" y="215" width="53" height="42" rx="10"/>
    <rect x="194" y="215" width="53" height="42" rx="10"/>
    <rect x="269" y="215" width="53" height="42" rx="10"/>
    <rect x="344" y="215" width="53" height="42" rx="10"/>
    <rect x="119" y="278" width="53" height="42" rx="10"/>
    <rect x="194" y="278" width="53" height="42" rx="10"/>
    <rect x="344" y="278" width="53" height="42" rx="10"/>
    <rect x="119" y="341" width="53" height="42" rx="10"/>
    <rect x="194" y="341" width="53" height="42" rx="10"/>
    <rect x="269" y="341" width="53" height="42" rx="10"/>
  </g>

  <!-- Día seleccionado -->
  <rect x="265" y="271" width="61" height="57"
        rx="15" fill="url(#yellow)"/>

  <path d="M278 299 L291 311 L314 286"
        fill="none" stroke="#292D35" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Reloj -->
  <circle cx="386" cy="371" r="76"
          fill="#17191E" stroke="#E9A900" stroke-width="9"/>

  <circle cx="386" cy="371" r="65" fill="url(#bg)"/>

  <!-- Marcas del reloj -->
  <g fill="#E7E8EC">
    <rect x="381" y="315" width="10" height="15" rx="5"/>
    <rect x="381" y="412" width="10" height="15" rx="5"/>
    <rect x="329" y="366" width="15" height="10" rx="5"/>
    <rect x="428" y="366" width="15" height="10" rx="5"/>
  </g>

  <!-- Manecillas -->
  <path d="M386 342 V373 L412 391"
        fill="none" stroke="url(#yellow)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="386" cy="371" r="6" fill="#FFE64A"/>
</svg>
