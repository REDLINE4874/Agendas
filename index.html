<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda de Prospectos</title>
    <link rel="stylesheet" href="styles.css?v=2" />
    <script src="script.js?v=2" defer></script>
  </head>
  <body>
    
    <div class="app">
      
      <div class="header">
        
        <div class="header-icon">
          
          <svg viewBox="0 0 24 24">
            <rect x="2" y="3" width="20" height="18" rx="2" />
            <path d="M8 7h8M8 11h8M8 15h5" />
          </svg>
        </div>
        <div>
          <h1>Agenda de prospectos</h1>
          <p>Tarjetas de crédito</p>
        </div>
        <button class="theme-switch" onclick="toggleTheme()" type="button" aria-label="Cambiar tema" title="Cambiar tema">
          <span class="theme-switch__track">
            <span class="theme-switch__thumb">
              <span class="theme-switch__icon theme-switch__icon--sun" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="4.2"></circle>
                  <path d="M12 2.5v2.2M12 19.3v2.2M4.7 12H2.5M21.5 12h-2.2M5.9 5.9l-1.6-1.6M19.7 19.7l-1.6-1.6M5.9 18.1l-1.6 1.6M19.7 4.3l-1.6 1.6"></path>
                </svg>
              </span>
              <span class="theme-switch__icon theme-switch__icon--moon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M20 13.4A8 8 0 1 1 10.6 4a6.5 6.5 0 1 0 9.4 9.4Z"></path>
                </svg>
              </span>
            </span>
          </span>
        </button>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="cambiarTab('nuevo', this)">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </span>
          <span>Nuevo prospecto</span>
        </button>
        <button class="tab" onclick="cambiarTab('lista', this)">

          Mis prospectos
        </button>
        <button class="tab" onclick="cambiarTab('config', this)">
          ⚙ Configuración
        </button>
      </div>

      <!-- NUEVO PROSPECTO -->
      <div id="panel-nuevo" class="panel active">
        <div class="card">
          <div class="form-grid">
            <div class="form-group">
              <div class="input-container">
                <input
                  type="text"
                  id="f-nombre"
                  placeholder=" "
                  autocomplete="off"
                />
                <label for="f-nombre">Nombre completo *</label>
              </div>
            </div>
            <div class="form-group">
              <div class="input-container">
                <input type="tel" id="f-tel" placeholder=" " />
                <label for="f-tel">Teléfono *</label>
              </div>
            </div>
            <div class="form-group">
              <div class="input-container">
                <select id="f-tipo">
                  <option value="">Selecciona un producto</option>
                  <option>Joy</option>
                  <option>Teleton</option>
                  <option>Clasica</option>
                  <option>Oro</option>
                  <option>Descubre</option>
                  <option>Platinum</option>
                  <option>Explora</option>
                </select>
                <label for="f-tipo">Tipo de tarjeta / producto</label>
              </div>
            </div>
            <div class="form-group">
              <div class="input-container">
                <select id="f-estatus">
                  <option value="Interesado">Interesado</option>
                  <option value="En proceso">En proceso</option>
                  <option value="Cerrado">Cerrado</option>
                  <option value="Perdido">Perdido</option>
                </select>
                <label for="f-estatus">Estatus</label>
              </div>
            </div>
            <div class="form-group">
              <div class="input-container">
                <div class="date-input-wrap">
                  <input type="date" id="f-fecha" />
                  <button
                    type="button"
                    class="date-picker-btn"
                    aria-label="Abrir calendario"
                    onclick="const i=document.getElementById('f-fecha'); if (i.showPicker) { i.showPicker(); } else { i.focus(); }"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                      <path d="M3 10h18M8 3v4M16 3v4"></path>
                    </svg>
                  </button>
                </div>
                <label for="f-fecha">Fecha de seguimiento</label>
              </div>
            </div>
            <div class="form-group full">
              <div class="input-container">
                <textarea
                  id="f-notas"
                  placeholder="Observaciones, intereses del cliente, recordatorios..."
                ></textarea>
                <label for="f-notas">Notas</label>
              </div>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-sm" onclick="limpiarForm()">Limpiar</button>

            <button
              class="btn btn-sm"
              id="btn-cancelar"
              onclick="limpiarForm()"
              style="display: none"
            >
              Cancelar edición
            </button>

            <button
              class="btn btn-primary"
              id="btn-guardar"
              onclick="guardarProspecto()"
            >
              <span id="btn-text"> Guardar prospecto </span>
            </button>
          </div>
        </div>
      </div>

      <!-- LISTA -->
      <div id="panel-lista" class="panel">
        <div class="search-bar">
          <div class="input-container" style="flex:1; min-width:160px; max-width:280px;">
            <input
              type="text"
              id="buscador"
              placeholder="Buscar nombre o teléfono..."
              oninput="filtrar()"
            />
            <label for="buscador">Buscar</label>
          </div>
          <div class="input-container" style="min-width:140px; max-width:200px;">
            <select id="filtro-estatus" onchange="filtrar()">
              <option value="">Todos los estatus</option>
              <option>Interesado</option>
              <option>En proceso</option>
              <option>Cerrado</option>
              <option>Perdido</option>
            </select>
            <label for="filtro-estatus">Estatus</label>
          </div>
          <button class="btn btn-sm" onclick="cargarLista()">
            ↻ Actualizar
          </button>
        </div>
        <div class="card" style="padding: 0; overflow: hidden">
          <div id="tabla-wrap">
            <div class="empty">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 3" />
              </svg>
              <p>Sin datos todavía</p>
              <small
                >Configura tu Google Sheet y agrega el primer prospecto.</small
              >
            </div>
          </div>
        </div>
      </div>

      <!-- CONFIG -->
      <div id="panel-config" class="panel">
        <!-- <div class="card">
          <p style="font-weight: 600; font-size: 15px; margin-bottom: 1.25rem">
            Conectar con Google Sheets
          </p>

          <div class="steps">
            <div class="step">
              <div class="step-num">1</div>
              <p>
                Ve a <strong>Google Sheets</strong>, crea una hoja nueva. En el
                menú abre <strong>Extensiones → Apps Script</strong>.
              </p>
            </div>
            <div class="step">
              <div class="step-num">2</div>
              <p>
                Borra el contenido del editor, pega el código de abajo y guarda
                con <code>Ctrl+S</code>.
              </p>
            </div>
            <div class="step">
              <div class="step-num">3</div>
              <p>
                Haz clic en <strong>Implementar → Nueva implementación</strong>.
                Tipo: <code>Aplicación web</code>. Acceso:
                <code>Cualquier usuario</code>. Autoriza y copia la URL.
              </p>
            </div>
            <div class="step">
              <div class="step-num">4</div>
              <p>
                Pega la URL aquí abajo y presiona
                <strong>Probar conexión</strong>.
              </p>
            </div>
          </div> -->

          <div class="form-group" style="margin-bottom: 1rem">
            <div class="input-row">
              <div class="input-container" style="flex:1;">
                <input
                  type="url"
                  id="cfg-url"
                  placeholder="https://script.google.com/macros/s/..."
                  oninput="guardarCfg()"
                />
                <label for="cfg-url">URL de tu Apps Script</label>
              </div>
              <button class="btn btn-sm" onclick="probar()">
                Probar conexión
              </button>
            </div>
          </div>

          <div
            class="form-group"
            style="margin-bottom: 1.5rem; max-width: 240px"
          >
            <div class="input-container">
              <input
                type="text"
                id="cfg-sheet"
                placeholder="Prospectos"
                oninput="guardarCfg()"
              />
              <label for="cfg-sheet">Nombre de la pestaña en el Sheet</label>
            </div>
          </div>

          <details>
            <summary>Ver código para Apps Script</summary>
            <pre id="code-block"></pre>
            <button
              class="btn btn-sm"
              style="margin-top: 8px"
              onclick="copiarCodigo()"
            >
              Copiar código
            </button>
          </details>
        </div>
      </div>
    </div>
    <!-- Modal de notas -->
<div id="modal-nota" class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h3 id="titulo-nota">📝 Nota del prospecto</h3>

      <button
        class="modal-close"
        onclick="cerrarNota()">
        ✕
      </button>

    </div>

    <div id="modal-texto" class="modal-body"></div>

  </div>

</div>
    <div id="toast"></div>
  </body>
</html>
